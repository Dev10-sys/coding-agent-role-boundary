[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "coding-agent-role-boundary"
version = "0.1.0"
description = "Mechanistic interpretability pilot: role boundary in coding agents"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.12"
dependencies = [
    "torch>=2.0",
    "transformers>=4.40",
    "scikit-learn>=1.3",
    "numpy>=1.24",
    "matplotlib>=3.7",
    "scipy>=1.10",
    "datasets>=2.14",
    "accelerate>=0.20",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
